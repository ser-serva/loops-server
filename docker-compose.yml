services:
    ## MariaDB and Redis (optional)
    mysqldb:
        image: mysql:9
        container_name: loops-db
        restart: unless-stopped
        env_file:
            - .env
        environment:
            MYSQL_DATABASE: ${DB_DATABASE}
            MYSQL_USER: ${DB_USERNAME}
            MYSQL_PASSWORD: ${DB_PASSWORD}
            MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
        volumes:
            - ./mysqldb-9-data:/var/lib/mysql
        healthcheck:
            test:
                [
                    'CMD',
                    'mysqladmin',
                    'ping',
                    '-h',
                    '127.0.0.1',
                    '-u',
                    'root',
                    '-p$$MYSQL_ROOT_PASSWORD'
                ]
            interval: 10s
            timeout: 5s
            retries: 3
            start_period: 30s
        networks:
            - loops-network

    redis:
        image: redis/redis-stack-server:7.4.0-v8
        container_name: loops-redis
        restart: unless-stopped
        env_file:
            - .env
        environment:
            #REDIS_ARGS: "--save 3600 1000 --appendonly yes --requirepass ${REDIS_PASSWORD}"  ## Save Redis to disk every hour & Write the logs to disk using AOF
            REDIS_ARGS: '--appendonly yes --requirepass ${REDIS_PASSWORD}'
        volumes:
            - ./redis-data:/data
        healthcheck:
            test:
                ['CMD-SHELL', 'redis-cli -a $$REDIS_PASSWORD --no-auth-warning ping | grep -q PONG']
            interval: 10s
            timeout: 3s
            retries: 3
            start_period: 10s
        networks:
            - loops-network

    minio:
        image: minio/minio:RELEASE.2025-09-07T16-13-09Z
        container_name: loops-minio
        restart: unless-stopped
        command: server /data --console-address ":9001"
        ports:
            - '9000:9000'
            - '9001:9001'
        env_file:
            - .env
        environment:
            MINIO_ROOT_USER: ${MINIO_ROOT_USER}
            MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
        volumes:
            - ./minio-data:/data
        healthcheck:
            test: ['CMD', 'curl', '-f', 'http://localhost:9000/minio/health/live']
            interval: 10s
            timeout: 5s
            retries: 3
            start_period: 15s
        networks:
            - loops-network

    minio-init:
        image: minio/mc:RELEASE.2025-08-13T08-35-41Z
        container_name: loops-minio-init
        restart: 'no'
        depends_on:
            minio:
                condition: service_healthy
        env_file:
            - .env
        entrypoint: >
            /bin/sh -c "
            mc alias set local http://minio:9000 $$MINIO_ROOT_USER $$MINIO_ROOT_PASSWORD &&
            mc mb --ignore-existing local/loops &&
            mc anonymous set download local/loops &&
            echo 'MinIO bucket ready'
            "
        networks:
            - loops-network

    mailpit:
        image: axllent/mailpit:v1.29.1
        container_name: loops-mailpit
        restart: unless-stopped
        ports:
            - '8025:8025'
        networks:
            - loops-network

    ## Pixelfed containers - App (Web/API), Horizon Queue, Scheduled task.
    loops:
        build:
            context: .
            dockerfile: Dockerfile
        container_name: loops-app
        restart: unless-stopped
        ports:
            - '8085:8080'
        env_file:
            - .env
        environment:
            # SSL Configuration (handled by reverse proxy)
            SSL_MODE: 'off'
            # PHP Configuration
            PHP_POST_MAX_SIZE: '500M'
            PHP_UPLOAD_MAX_FILE_SIZE: '500M'
            PHP_OPCACHE_ENABLE: '1'
            PHP_MEMORY_LIMIT: '512M'
            # Laravel Auto-run Configuration
            AUTORUN_ENABLED: 'true'
            AUTORUN_LARAVEL_MIGRATION: 'true'
            AUTORUN_LARAVEL_MIGRATION_ISOLATION: 'true'
            AUTORUN_LARAVEL_STORAGE_LINK: 'true'
            AUTORUN_LARAVEL_EVENT_CACHE: 'true'
            AUTORUN_LARAVEL_ROUTE_CACHE: 'true'
            AUTORUN_LARAVEL_VIEW_CACHE: 'true'
            AUTORUN_LARAVEL_CONFIG_CACHE: 'true'
        volumes:
            - ./storage:/var/www/html/storage
            - ./bootstrap/cache:/var/www/html/bootstrap/cache
        depends_on:
            mysqldb:
                condition: service_healthy
            redis:
                condition: service_healthy
        networks:
            - loops-network

    horizon:
        build:
            context: .
            dockerfile: Dockerfile
        container_name: loops-horizon
        restart: unless-stopped
        command: ['php', 'artisan', 'horizon']
        env_file:
            - .env
        environment:
            # Laravel Auto-run Configuration
            AUTORUN_ENABLED: 'false'
            AUTORUN_LARAVEL_MIGRATION: 'false'
            AUTORUN_LARAVEL_MIGRATION_ISOLATION: 'false'
            AUTORUN_LARAVEL_STORAGE_LINK: 'true'
            AUTORUN_LARAVEL_EVENT_CACHE: 'false'
            AUTORUN_LARAVEL_ROUTE_CACHE: 'false'
            AUTORUN_LARAVEL_VIEW_CACHE: 'false'
            AUTORUN_LARAVEL_CONFIG_CACHE: 'true'
            PHP_POST_MAX_SIZE: '500M'
            PHP_UPLOAD_MAX_FILE_SIZE: '500M'
            PHP_OPCACHE_ENABLE: '1'
            LD_LIBRARY_PATH: '/usr/lib/wsl/lib'
        volumes:
            - ./storage:/var/www/html/storage
            - ./bootstrap/cache:/var/www/html/bootstrap/cache
            - /usr/lib/wsl/lib:/usr/lib/wsl/lib:ro
        depends_on:
            mysqldb:
                condition: service_healthy
            redis:
                condition: service_healthy
        runtime: nvidia
        deploy:
            resources:
                reservations:
                    devices:
                        - driver: nvidia
                          count: all
                          capabilities: [gpu]
        healthcheck:
            test: ['CMD', 'php', 'artisan', 'horizon:status']
            interval: 10s
            timeout: 5s
            retries: 3
        networks:
            - loops-network

    scheduler:
        build:
            context: .
            dockerfile: Dockerfile
        container_name: loops-scheduler
        restart: unless-stopped
        command: ['php', 'artisan', 'schedule:work']
        stop_signal: SIGTERM
        env_file:
            - .env
        environment:
            # Laravel Auto-run Configuration
            AUTORUN_ENABLED: 'false'
            AUTORUN_LARAVEL_MIGRATION: 'false'
            AUTORUN_LARAVEL_MIGRATION_ISOLATION: 'false'
            AUTORUN_LARAVEL_STORAGE_LINK: 'true'
            AUTORUN_LARAVEL_EVENT_CACHE: 'false'
            AUTORUN_LARAVEL_ROUTE_CACHE: 'false'
            AUTORUN_LARAVEL_VIEW_CACHE: 'false'
            AUTORUN_LARAVEL_CONFIG_CACHE: 'true'
            PHP_POST_MAX_SIZE: '500M'
            PHP_UPLOAD_MAX_FILE_SIZE: '500M'
            PHP_OPCACHE_ENABLE: '1'
        volumes:
            - ./storage:/var/www/html/storage
            - ./bootstrap/cache:/var/www/html/bootstrap/cache
        depends_on:
            mysqldb:
                condition: service_healthy
            redis:
                condition: service_healthy
        healthcheck:
            test: ['CMD', 'healthcheck-schedule']
            start_period: 10s
        networks:
            - loops-network

networks:
    loops-network:
        driver: bridge
